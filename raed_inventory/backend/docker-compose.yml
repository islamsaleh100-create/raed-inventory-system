version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Raed Inventory System — Docker Compose
# Usage:
#   Development:  docker compose up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: raed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raed_user
      POSTGRES_PASSWORD: raed_pass
      POSTGRES_DB: raed_inventory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raed_user -d raed_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raed_api
    restart: unless-stopped
    environment:
      ENV_FILE: .env
      DATABASE_URL: postgresql://raed_user:raed_pass@db:5432/raed_inventory
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-chars!!}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MULTI_TENANT_ENABLED: ${MULTI_TENANT_ENABLED:-false}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AUDIT_LOG_ENABLED: ${AUDIT_LOG_ENABLED:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting application...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - .:/app        # hot-reload in development
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── pgAdmin (optional, dev only) ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: raed_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@raed.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - dev       # only starts with: docker compose --profile dev up

volumes:
  postgres_data:
    driver: local
