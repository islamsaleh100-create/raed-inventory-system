# Railway deployment config for Raed Inventory backend.
# Place this file at: backend/railway.toml
# Set "Root Directory" in the Railway service settings to: backend
# Required env vars (set in Railway dashboard):
#   DATABASE_URL       provided automatically when you add the Postgres plugin
#   SECRET_KEY         generate a strong random value (at least 32 chars)
#   ENVIRONMENT        production
#   ALLOWED_ORIGINS    e.g. https://your-frontend.up.railway.app
#   ADMIN_PASSWORD     initial admin bootstrap password (change after first login)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Run alembic + start uvicorn on Railway-injected $PORT.
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30
