# Alembic configuration for Raed Inventory System
# ---------------------------------------------------------------------------
# The script_location points to the alembic/ directory relative to this file.
# The sqlalchemy.url is intentionally left blank here — env.py reads it from
# app.config.settings so we never hard-code credentials in version control.
# ---------------------------------------------------------------------------

[alembic]
script_location = alembic

# Add the alembic.ini directory (= backend/) to sys.path so env.py can
# `from app.database import Base`. Without this, invoking alembic via the
# console script (alembic.exe on Windows) raises ModuleNotFoundError: 'app'.
prepend_sys_path = .

# Leave empty — env.py pulls this from app.config.settings.DATABASE_URL
sqlalchemy.url =

# Migration file naming: timestamp_slug.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used in generated file names (UTC is safest for teams)
timezone = UTC

# Truncate slug length in generated filenames
truncate_slug_length = 40

# Output encoding for generated migration scripts
output_encoding = utf-8


[post_write_hooks]
# Optionally run black/isort on generated migration files.
# Uncomment when black is available in the project environment:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
