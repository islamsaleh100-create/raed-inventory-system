[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    unit: Pure unit tests with no DB or HTTP calls
    integration: Tests that hit the TestClient / DB
    slow: Tests that are slow (e.g. bulk import, large seed)
    epic1: Epic 1 — Foundation
    epic2: Epic 2 — Master Data
    epic3: Epic 3 — Inventory Workflow
    epic4_9: Epics 4–9 — Orders, Stock, Ledger, Users, Reports, Alerts
    epic10_13: Epics 10–13 — Replenishment, Dashboard, Export, Multi-tenant
    epic14: Epic 14 — Audit Log

# ── asyncio ───────────────────────────────────────────────────────────────────
asyncio_mode = auto
