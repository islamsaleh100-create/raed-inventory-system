version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: raed_lan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raed_user
      POSTGRES_PASSWORD: raed_pass
      POSTGRES_DB: raed_inventory
    volumes:
      - postgres_lan_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raed_user -d raed_inventory"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raed_lan_api
    restart: unless-stopped
    environment:
      ENV_FILE: .env.postgres.local
      DATABASE_URL: postgresql://raed_user:raed_pass@db:5432/raed_inventory
      SECRET_KEY: raed-lan-postgres-secret-change-me
      ENVIRONMENT: local
      DEBUG: "false"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8010
      ADMIN_PASSWORD: Admin@2025
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    command: >
      sh -c "
        alembic upgrade head &&
        python seed_supply_chain_demo.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_lan_data:
    driver: local
